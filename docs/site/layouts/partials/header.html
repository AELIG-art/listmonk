<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · AELIG Mail{{ end }}</title>
  <meta name="description" content="{{with .Description }}{{ . }}{{else}}AELIG Mail is a self-hosted platform for newsletters, mailing lists, and transactional email campaigns.{{end}}" />
  <meta property="og:description" content="{{with .Description }}{{ . }}{{else}}AELIG Mail is a self-hosted platform for newsletters, mailing lists, and transactional email campaigns.{{end}}" />
  <meta name="keywords" content="{{ if .Keywords }}{{ range .Keywords }}{{ . }}, {{ end }}{{else if isset .Params "tags" }}{{ range .Params.tags }}{{ . }}, {{ end }}{{end}}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">
  <link href="{{ .Site.BaseURL }}static/style.css" rel="stylesheet" type="text/css" />

  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
  <link rel="icon" href="{{ .Site.BaseURL }}static/images/logo.svg" type="image/svg+xml" />

  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · AELIG Mail{{ end }}" />
  {{ if .Params.thumbnail }}
    <link rel="image_src" href="{{ .Site.BaseURL }}static/images/{{ .Params.thumbnail }}" />
    <meta property="og:image" content="{{ .Site.BaseURL }}static/images/{{ .Params.thumbnail }}" />
  {{ else }}
    <link rel="image_src" href="{{ .Site.BaseURL }}static/images/thumbnail.webp" />
    <meta property="og:image" content="{{ .Site.BaseURL }}static/images/thumbnail.webp" />
  {{ end }}
</head>
<body>
<nav data-topnav>
  <div class="container hstack justify-between">
    <a href="{{ .Site.BaseURL }}" class="logo" aria-label="AELIG Mail home">{{ readFile "static/static/images/logo.svg" | safeHTML }}</a>
    <div class="hstack gap-6">
      <a href="{{ .Site.BaseURL }}#download">Download</a>
      <a href="{{ .Site.BaseURL }}docs">Docs</a>
    </div>
  </div>
</nav>
