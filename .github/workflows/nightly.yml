name: nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_changes.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly release
        id: check_changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_NIGHTLY_SHA=$(gh release view nightly --json targetCommitish -q '.targetCommitish' 2>/dev/null || echo "")
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Last nightly SHA: $LAST_NIGHTLY_SHA"
          echo "Current SHA: $CURRENT_SHA"
          if [ -n "$LAST_NIGHTLY_SHA" ] && [ "$LAST_NIGHTLY_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last nightly build, skipping ..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, proceeding with build ..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  nightly:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Set nightly date
        id: tag
        run: |
          NIGHTLY_DATE=$(date -u +%Y-%m-%d)
          echo "date=$NIGHTLY_DATE" >> $GITHUB_OUTPUT

      - name: Prepare dependencies
        run: make dist
        env:
          AELIG_MAIL_VERSION: nightly-${{ steps.tag.outputs.date }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --parallelism 1 --clean --config .goreleaser-nightly.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AELIG_MAIL_VERSION: nightly-${{ steps.tag.outputs.date }}

      - name: Push Docker images
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aelig-mail
        run: |
          docker push "$IMAGE:nightly-amd64"
          docker push "$IMAGE:nightly-arm64v8"
          docker push "$IMAGE:nightly-armv6"
          docker push "$IMAGE:nightly-armv7"
          docker buildx imagetools create -t "$IMAGE:nightly" \
            "$IMAGE:nightly-amd64" "$IMAGE:nightly-arm64v8" \
            "$IMAGE:nightly-armv6" "$IMAGE:nightly-armv7"
          docker buildx imagetools inspect "$IMAGE:nightly"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly \
            --title "Nightly release" \
            --notes "
          > **Warning**: This is an automated nightly build from the master branch.
          > It may contain bugs and breaking changes. Use at your own risk.
          > Container image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/aelig-mail:nightly.
          > For stable releases, use a versioned release.

          Built from commit: $(git rev-parse --short HEAD)" \
            --prerelease \
            --target $(git rev-parse HEAD) \
            dist/*.tar.gz
