services:
  adminer:
    image: adminer:4.8.1-standalone
    restart: always
    ports:
      - "127.0.0.1:8070:8080"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    # Share 'localhost' with the dev container.
    network_mode: "service:dev"

  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=aelig-mail-dev
      - POSTGRES_USER=aelig_mail_dev
      - POSTGRES_DB=aelig_mail_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - type: volume
        source: aelig-mail-dev-db
        target: /var/lib/postgresql

  dev:
    build:
      context: ../
      dockerfile: dev/app.Dockerfile
    init: true
    environment:
      DEV_CONFIG: dev/config.toml
      AELIG_MAIL_db__host: db
      AELIG_MAIL_db__user: aelig_mail_dev
      AELIG_MAIL_db__password: aelig-mail-dev
      AELIG_MAIL_db__database: aelig_mail_dev
      MAILHOG_EXTERNAL: "1"
      MAILHOG_URL: http://localhost:8025
      MAILHOG_SMTP_HOST: localhost
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:1025:1025" # MailHog SMTP
      - "127.0.0.1:8025:8025" # MailHog UI
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - admin-dist:/app/static/admin/dist
      - type: volume
        source: node-modules
        target: /app/static/admin/node_modules
        volume:
          nocopy: true

volumes:
  aelig-mail-dev-db:
  go-mod:
  go-build:
  admin-dist:
  node-modules:
