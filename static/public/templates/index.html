{{ define "header" }}
<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />	
	<title>{{ .Data.Title }} · AELIG Mail</title>
	<meta name="description" content="AELIG Mail helps you manage newsletters, mailing lists, and email campaigns." />
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />

	{{ if .EnablePublicArchive }}
		<link rel="alternate" type="application/rss+xml" title="{{ L.T "public.archiveTitle" }} - {{ .SiteName }}"
			href="{{ .RootURL }}/archive.xml" />
	{{ end }}

	<link href="/public/static/style.css?v={{ .AssetVersion }}" rel="stylesheet" type="text/css" />
	<link href="/public/custom.css?v={{ .CustomAssetVersion }}" rel="stylesheet" type="text/css">
	<script src="/public/custom.js?v={{ .CustomAssetVersion }}" async defer></script>

	<link rel="icon" href="{{ URI "/admin/static/logo.svg" }}?v={{ .AssetVersion }}" type="image/svg+xml" />
</head>
<body>
    <div class="container wrap">
		<header class="header">
			<div class="logo">
				<a href="{{ if .EnablePublicSubPage }}{{ .RootURL}}/subscription/form{{ end }}">
				{{ if ne .LogoURL "" }}
					<img src="{{ .LogoURL }}" alt="{{ .Data.Title }}" />
				{{ else }}
					<img class="default-logo" src="{{ URI "/admin/static/logo.svg" }}?v={{ .AssetVersion }}" alt="" /><span class="brand-name"><strong>AELIG</strong> Mail</span>
				{{ end }}
				</a>
			</div>
		</header>
{{ end }}

{{ define "footer" }}
	</div>
</body>
</html>
{{ end }}
