{{ define "settings-appearance" -}}
<div class="settings-items">
	<ot-tabs class="settings-subtabs">
		<div role="tablist">
			<button type="button" role="tab">{{ .L.T "globals.terms.admin" }}</button>
			<button type="button" role="tab">{{ .L.T "globals.terms.public" }}</button>
		</div>

		<div role="tabpanel">
			<fieldset class="card" data-keywords="appearance admin custom javascript js script ui">
				<legend>{{ .L.T "settings.appearance.customJS" }}</legend>
				<code-editor lang="javascript" x-init="$el.value = form['appearance.admin.custom_js']" @input.self="form['appearance.admin.custom_js'] = $event.target.value"></code-editor>
			</fieldset>
		</div>

		<div role="tabpanel">
			<fieldset class="card" data-keywords="appearance public custom javascript js script subscription page">
				<legend>{{ .L.T "settings.appearance.customJS" }}</legend>
				<code-editor lang="javascript" x-init="$el.value = form['appearance.public.custom_js']" @input.self="form['appearance.public.custom_js'] = $event.target.value"></code-editor>
			</fieldset>
		</div>
	</ot-tabs>
</div>
{{- end }}
